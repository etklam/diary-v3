<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>離線 / Offline — Trade basic</title>
    <!--
      Served by the service worker when a navigation cannot reach the network.
      It is precached, so it must stay self-contained: no build assets, no
      account data, and no network request of its own.
    -->
    <style>
      :root { color-scheme: light dark; --canvas: #f6f7f8; --surface: #fff; --text: #20242a; --muted: #59616c; --border: #d5d9df; --action: #2459b8; --on-action: #fff; }
      @media (prefers-color-scheme: dark) {
        :root { --canvas: #17191d; --surface: #202329; --text: #edf0f4; --muted: #b1b8c3; --border: #454c57; --action: #9bbcff; --on-action: #10234a; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--canvas); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; line-height: 1.65; }
      main { max-width: 32rem; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; box-shadow: 0 1px 2px rgb(18 22 30 / 0.05); }
      h1 { font-size: 1.5rem; font-weight: 700; line-height: 1.35; margin: 0 0 12px; }
      p { margin: 0 0 12px; }
      p.secondary { color: var(--muted); }
      button { min-height: 44px; padding: 9px 18px; font: inherit; font-weight: 600; border: 1px solid transparent; border-radius: 6px; background: var(--action); color: var(--on-action); cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--action); outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    </style>
  </head>
  <body>
    <main>
      <h1>目前離線 / You are offline</h1>
      <p>這個頁面需要連線才能載入。恢復連線之後再試一次。</p>
      <p class="secondary" lang="en">This page needs a connection. Reconnect and try again.</p>
      <p class="secondary">已儲存在這部裝置的日記草稿不受影響。 / Diary drafts saved on this device are unaffected.</p>
      <button type="button" onclick="location.reload()">重新載入 / Reload</button>
    </main>
  </body>
</html>
