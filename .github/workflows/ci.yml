name: verify
on: [push, pull_request]
jobs:
  first-diary:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: diary_v3
          POSTGRES_USER: diary
          POSTGRES_PASSWORD: diary_local
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U diary -d diary_v3"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://diary:diary_local@127.0.0.1:55433/diary_v3
      JWT_SECRET: ci-only-diary-secret-not-for-use-outside-tests-123456
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run disposable backup and restore gate
        run: npm run db:restore-smoke
      - run: npm run contracts:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
  production-images:
    needs: first-diary
    if: ${{ needs.first-diary.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production API image
        run: docker build --target api --tag diary-v3/api:ci .
      - name: Build the production Web image
        run: docker build --target web --tag diary-v3/web:ci .
