apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: diary-v3
  namespace: diary-v3
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts: [v3.trade-basic.com]
      secretName: v3-trade-basic-com-tls
  rules:
    - host: v3.trade-basic.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: diary-v3-api
                port:
                  name: http
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: diary-v3-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: diary-v3-web
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: diary-v3-system
  namespace: diary-v3
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.priority: "100"
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [v3.trade-basic.com]
      secretName: v3-trade-basic-com-tls
  rules:
    - host: v3.trade-basic.com
      http:
        paths:
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: diary-v3-api
                port:
                  name: http
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: diary-v3-api
                port:
                  name: http
