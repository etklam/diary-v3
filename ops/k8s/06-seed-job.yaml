apiVersion: batch/v1
kind: Job
metadata:
  name: diary-v3-system-seed
  namespace: diary-v3
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: diary-v3-system-seed
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: diary-v3/api:local
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/api/seed-system.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: diary-v3-app
                  key: DATABASE_URL
