name: deploy
on:
  push:
    branches: [main]

concurrency:
  group: diary-v3-production-deploy
  cancel-in-progress: false

env:
  REGISTRY: git.913555.xyz
  OWNER: etklam
  DEPLOY_HOST: 82.22.63.196
  DEPLOY_USER: root
  DEPLOY_NAMESPACE: diary-v3

jobs:
  verify-build-deploy:
    runs-on: hk
    steps:
      - name: Install Docker CLI
        env:
          DOCKER_CLI_SHA256: ${{ secrets.DOCKER_CLI_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$DOCKER_CLI_SHA256" || { echo 'DOCKER_CLI_SHA256 secret is required' >&2; exit 1; }
          archive=/tmp/docker-27.5.1.tgz
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz -o "$archive"
          echo "$DOCKER_CLI_SHA256  $archive" | sha256sum -c -
          tar xz --strip-components=1 -C /usr/bin docker/docker < "$archive"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Use pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Tracked secret scan
        run: |
          set -euo pipefail
          if git grep -nE '(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- ':!*.md' ':!ops/k3s/deploy-production-secrets.sh'; then
            echo 'Potential secret detected in tracked files' >&2
            exit 1
          fi
          git ls-files --error-unmatch .dockerignore
          grep -qxF '.env' .dockerignore
          grep -qxF '.env.*' .dockerignore

      - name: Install deps
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Contracts check
        run: npm run contracts:check

      - name: Validate source deployment manifests
        run: npm run manifests:check

      - name: PostgreSQL backup and restore smoke
        run: |
          set -euo pipefail
          JOB_CONTAINER=$(cat /etc/hostname)
          docker inspect "$JOB_CONTAINER" >/dev/null || { echo "cannot resolve job container '$JOB_CONTAINER'" >&2; exit 1; }
          RESTORE_SMOKE_CONTAINER=diary-v3-ci-restore-smoke \
          RESTORE_SMOKE_JOB_CONTAINER="$JOB_CONTAINER" \
          RESTORE_SMOKE_PORT=5432 \
          npm run db:restore-smoke

      - name: Start disposable PostgreSQL
        run: |
          set -euo pipefail
          # The job itself runs inside a container, so a host-published port would
          # bind the host loopback, unreachable from the job's network namespace.
          # Share the job container's network namespace instead: PostgreSQL then
          # listens on 127.0.0.1:5432 inside the job itself, keeping the
          # local-only DATABASE_URL guard in tests meaningful.
          JOB_CONTAINER=$(cat /etc/hostname)
          docker inspect "$JOB_CONTAINER" >/dev/null || { echo "cannot resolve job container '$JOB_CONTAINER'" >&2; exit 1; }
          docker rm -f diary-v3-ci-postgres >/dev/null 2>&1 || true
          docker run -d --name diary-v3-ci-postgres \
            --network "container:$JOB_CONTAINER" \
            -e POSTGRES_DB=diary_v3 -e POSTGRES_USER=diary -e POSTGRES_PASSWORD=ci_disposable_only \
            postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          for attempt in $(seq 1 30); do
            if docker exec diary-v3-ci-postgres pg_isready -h 127.0.0.1 -U diary -d diary_v3 >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs diary-v3-ci-postgres
          exit 1

      - name: API integration tests
        env:
          DATABASE_URL: postgresql://diary:***@127.0.0.1:5432/diary_v3
          JWT_SECRET: ci-only-diary-secret-not-for-use-outside-tests-123456
          NODE_ENV: test
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Full Chromium regression
        env:
          DATABASE_URL: postgresql://diary:***@127.0.0.1:5432/diary_v3
          CI: "true"
        run: npm run test:e2e

      - name: WebKit critical path
        env:
          DATABASE_URL: postgresql://diary:***@127.0.0.1:5432/diary_v3
          CI: "true"
        run: npm run test:e2e:webkit:critical

      - name: Release artifact acceptance
        env:
          DATABASE_URL: postgresql://diary:***@127.0.0.1:5432/diary_v3
          CI: "true"
        run: |
          npm run test:e2e:release

      - name: Stop disposable PostgreSQL
        if: always()
        run: docker rm -f diary-v3-ci-postgres || true

      - name: Login to Forgejo Registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build API and Web images
        run: |
          set -euo pipefail
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker build --platform linux/amd64 --target api -t "$REGISTRY/$OWNER/diary-v3-api:$SHA" .
          docker build --platform linux/amd64 --target web -t "$REGISTRY/$OWNER/diary-v3-web:$SHA" .

      - name: Push images
        run: |
          set -euo pipefail
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker push "$REGISTRY/$OWNER/diary-v3-api:$SHA"
          docker push "$REGISTRY/$OWNER/diary-v3-web:$SHA"

      - name: Resolve digests and render manifests
        run: |
          set -euo pipefail
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          API_IMAGE="$REGISTRY/$OWNER/diary-v3-api:$SHA"; WEB_IMAGE="$REGISTRY/$OWNER/diary-v3-web:$SHA"
          API_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$API_IMAGE" | sed 's/.*@//')
          WEB_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$WEB_IMAGE" | sed 's/.*@//')
          [[ "$API_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; [[ "$WEB_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "API_DIGEST=$API_DIGEST" >> "$GITHUB_ENV"; echo "WEB_DIGEST=$WEB_DIGEST" >> "$GITHUB_ENV"
          API_IMAGE_REF="$REGISTRY/$OWNER/diary-v3-api@$API_DIGEST"
          WEB_IMAGE_REF="$REGISTRY/$OWNER/diary-v3-web@$WEB_DIGEST"
          RELEASE_MANIFEST_DIR=$(mktemp -d /tmp/diary-v3-release.XXXXXX)
          echo "RELEASE_MANIFEST_DIR=$RELEASE_MANIFEST_DIR" >> "$GITHUB_ENV"
          node --import tsx scripts/render-release-manifests.ts \
            --target=production --api-image="$API_IMAGE_REF" --web-image="$WEB_IMAGE_REF" \
            --output-dir="$RELEASE_MANIFEST_DIR"
          node --import tsx scripts/validate-production-manifests.ts --namespace=diary-v3 --require-digests \
            "$RELEASE_MANIFEST_DIR"/*.yaml
          echo "Release source commit: ${{ github.sha }}"
          echo "Release API image: $API_IMAGE_REF"
          echo "Release Web image: $WEB_IMAGE_REF"
          echo 'Copy these exact digest references into the manual staging workflow inputs.'

      - name: Record current production workloads
        env: { DEPLOY_SSH_KEY: "${{ secrets.DEPLOY_SSH_KEY }}", DEPLOY_KNOWN_HOSTS: "${{ secrets.DEPLOY_KNOWN_HOSTS }}" }
        run: |
          set -euo pipefail
          SSH_KEY=$(mktemp); KNOWN_HOSTS=$(mktemp); trap 'rm -f "$SSH_KEY" "$KNOWN_HOSTS"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$SSH_KEY"; printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$KNOWN_HOSTS"; chmod 600 "$SSH_KEY" "$KNOWN_HOSTS"
          SSH_OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS -i $SSH_KEY"; REMOTE="$DEPLOY_USER@$DEPLOY_HOST"
          API_IMAGE_BEFORE=$(ssh $SSH_OPTS "$REMOTE" "kubectl -n $DEPLOY_NAMESPACE get deployment/diary-v3-api -o jsonpath='{.spec.template.spec.containers[?(@.name==\"api\")].image}'")
          WEB_IMAGE_BEFORE=$(ssh $SSH_OPTS "$REMOTE" "kubectl -n $DEPLOY_NAMESPACE get deployment/diary-v3-web -o jsonpath='{.spec.template.spec.containers[?(@.name==\"web\")].image}'")
          CRON_IMAGE_BEFORE=$(ssh $SSH_OPTS "$REMOTE" "kubectl -n $DEPLOY_NAMESPACE get cronjob/diary-v3-market -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[?(@.name==\"market\")].image}'")
          API_REPLICAS_BEFORE=$(ssh $SSH_OPTS "$REMOTE" "kubectl -n $DEPLOY_NAMESPACE get deployment/diary-v3-api -o jsonpath='{.spec.replicas}'")
          WEB_REPLICAS_BEFORE=$(ssh $SSH_OPTS "$REMOTE" "kubectl -n $DEPLOY_NAMESPACE get deployment/diary-v3-web -o jsonpath='{.spec.replicas}'")
          test -n "$API_IMAGE_BEFORE"; test -n "$WEB_IMAGE_BEFORE"; test -n "$CRON_IMAGE_BEFORE"
          for value in API_IMAGE_BEFORE WEB_IMAGE_BEFORE CRON_IMAGE_BEFORE API_REPLICAS_BEFORE WEB_REPLICAS_BEFORE; do echo "$value=${!value}" >> "$GITHUB_ENV"; done

      - name: Apply production foundation and run migrations
        env: { DEPLOY_SSH_KEY: "${{ secrets.DEPLOY_SSH_KEY }}", DEPLOY_KNOWN_HOSTS: "${{ secrets.DEPLOY_KNOWN_HOSTS }}" }
        run: |
          set -euo pipefail
          SSH_KEY=$(mktemp); KNOWN_HOSTS=$(mktemp); trap 'rm -f "$SSH_KEY" "$KNOWN_HOSTS"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$SSH_KEY"; printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$KNOWN_HOSTS"; chmod 600 "$SSH_KEY" "$KNOWN_HOSTS"
          SSH_OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS -i $SSH_KEY"; REMOTE="$DEPLOY_USER@$DEPLOY_HOST"
          ssh $SSH_OPTS "$REMOTE" "mkdir -p /tmp/diary-v3-release"
          scp $SSH_OPTS "$RELEASE_MANIFEST_DIR/00-namespace.yaml" "$RELEASE_MANIFEST_DIR/01-postgres.yaml" "$RELEASE_MANIFEST_DIR/04-ingress.yaml" "$REMOTE:/tmp/diary-v3-release/"
          scp $SSH_OPTS "$RELEASE_MANIFEST_DIR/07-migrate-job.yaml" "$RELEASE_MANIFEST_DIR/06-seed-job.yaml" "$REMOTE:/tmp/diary-v3-release/"
          ssh $SSH_OPTS "$REMOTE" "kubectl apply -f /tmp/diary-v3-release/00-namespace.yaml && kubectl apply -f /tmp/diary-v3-release/01-postgres.yaml && kubectl -n $DEPLOY_NAMESPACE rollout status deployment/diary-v3-postgres --timeout=300s"
          ssh $SSH_OPTS "$REMOTE" "kubectl -n $DEPLOY_NAMESPACE delete job diary-v3-migrate --ignore-not-found && kubectl apply -f /tmp/diary-v3-release/07-migrate-job.yaml && kubectl -n $DEPLOY_NAMESPACE wait --for=condition=complete job/diary-v3-migrate --timeout=600s"
          ssh $SSH_OPTS "$REMOTE" "kubectl -n $DEPLOY_NAMESPACE delete job diary-v3-system-seed --ignore-not-found && kubectl apply -f /tmp/diary-v3-release/06-seed-job.yaml && kubectl -n $DEPLOY_NAMESPACE wait --for=condition=complete job/diary-v3-system-seed --timeout=300s"

      - name: Deploy API
        env: { DEPLOY_SSH_KEY: "${{ secrets.DEPLOY_SSH_KEY }}", DEPLOY_KNOWN_HOSTS: "${{ secrets.DEPLOY_KNOWN_HOSTS }}" }
        run: |
          set -euo pipefail
          SSH_KEY=$(mktemp); KNOWN_HOSTS=$(mktemp); trap 'rm -f "$SSH_KEY" "$KNOWN_HOSTS"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$SSH_KEY"; printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$KNOWN_HOSTS"; chmod 600 "$SSH_KEY" "$KNOWN_HOSTS"
          SSH_OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS -i $SSH_KEY"; REMOTE="$DEPLOY_USER@$DEPLOY_HOST"
          scp $SSH_OPTS "$RELEASE_MANIFEST_DIR/02-api.yaml" "$REMOTE:/tmp/diary-v3-release/"
          echo 'DEPLOYMENT_MUTATED=true' >> "$GITHUB_ENV"; echo 'API_MUTATED=true' >> "$GITHUB_ENV"
          ssh $SSH_OPTS "$REMOTE" "kubectl apply -f /tmp/diary-v3-release/02-api.yaml && kubectl -n $DEPLOY_NAMESPACE rollout status deployment/diary-v3-api --timeout=300s"

      - name: Deploy Web
        env: { DEPLOY_SSH_KEY: "${{ secrets.DEPLOY_SSH_KEY }}", DEPLOY_KNOWN_HOSTS: "${{ secrets.DEPLOY_KNOWN_HOSTS }}" }
        run: |
          set -euo pipefail
          SSH_KEY=$(mktemp); KNOWN_HOSTS=$(mktemp); trap 'rm -f "$SSH_KEY" "$KNOWN_HOSTS"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$SSH_KEY"; printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$KNOWN_HOSTS"; chmod 600 "$SSH_KEY" "$KNOWN_HOSTS"
          SSH_OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS -i $SSH_KEY"; REMOTE="$DEPLOY_USER@$DEPLOY_HOST"
          scp $SSH_OPTS "$RELEASE_MANIFEST_DIR/03-web.yaml" "$REMOTE:/tmp/diary-v3-release/"
          echo 'WEB_MUTATED=true' >> "$GITHUB_ENV"
          ssh $SSH_OPTS "$REMOTE" "kubectl apply -f /tmp/diary-v3-release/03-web.yaml && kubectl -n $DEPLOY_NAMESPACE rollout status deployment/diary-v3-web --timeout=300s"

      - name: Deploy ingress and market CronJob
        env: { DEPLOY_SSH_KEY: "${{ secrets.DEPLOY_SSH_KEY }}", DEPLOY_KNOWN_HOSTS: "${{ secrets.DEPLOY_KNOWN_HOSTS }}" }
        run: |
          set -euo pipefail
          SSH_KEY=$(mktemp); KNOWN_HOSTS=$(mktemp); trap 'rm -f "$SSH_KEY" "$KNOWN_HOSTS"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$SSH_KEY"; printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$KNOWN_HOSTS"; chmod 600 "$SSH_KEY" "$KNOWN_HOSTS"
          SSH_OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS -i $SSH_KEY"; REMOTE="$DEPLOY_USER@$DEPLOY_HOST"
          scp $SSH_OPTS "$RELEASE_MANIFEST_DIR/05-market-cron.yaml" "$REMOTE:/tmp/diary-v3-release/"
          echo 'CRON_MUTATED=true' >> "$GITHUB_ENV"
          ssh $SSH_OPTS "$REMOTE" "kubectl apply -f /tmp/diary-v3-release/04-ingress.yaml && kubectl apply -f /tmp/diary-v3-release/05-market-cron.yaml"

      - name: Smoke test production
        env: { DEPLOY_SSH_KEY: "${{ secrets.DEPLOY_SSH_KEY }}", DEPLOY_KNOWN_HOSTS: "${{ secrets.DEPLOY_KNOWN_HOSTS }}" }
        run: |
          set -euo pipefail
          SSH_KEY=$(mktemp); KNOWN_HOSTS=$(mktemp); trap 'rm -f "$SSH_KEY" "$KNOWN_HOSTS"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$SSH_KEY"; printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$KNOWN_HOSTS"; chmod 600 "$SSH_KEY" "$KNOWN_HOSTS"
          SSH_OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS -i $SSH_KEY"; REMOTE="$DEPLOY_USER@$DEPLOY_HOST"
          ssh $SSH_OPTS "$REMOTE" "kubectl -n $DEPLOY_NAMESPACE run smoke-\$RANDOM --rm -i --restart=Never --image=curlimages/curl --command -- curl -fsS --max-time 10 http://diary-v3-api:3101/healthz"
          ssh $SSH_OPTS "$REMOTE" "kubectl -n $DEPLOY_NAMESPACE run smoke-\$RANDOM --rm -i --restart=Never --image=curlimages/curl --command -- curl -fsS --max-time 10 http://diary-v3-api:3101/readyz"
          ssh $SSH_OPTS "$REMOTE" "kubectl -n $DEPLOY_NAMESPACE wait --for=condition=Ready certificate/v3-trade-basic-com-tls --timeout=300s"
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://v3.trade-basic.com/)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://v3.trade-basic.com/articles)" = 200

      - name: Rollback affected workloads and Rollback smoke test
        if: failure() && env.DEPLOYMENT_MUTATED == 'true'
        env: { DEPLOY_SSH_KEY: "${{ secrets.DEPLOY_SSH_KEY }}", DEPLOY_KNOWN_HOSTS: "${{ secrets.DEPLOY_KNOWN_HOSTS }}" }
        run: |
          set -euo pipefail
          SSH_KEY=$(mktemp); KNOWN_HOSTS=$(mktemp); trap 'rm -f "$SSH_KEY" "$KNOWN_HOSTS"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$SSH_KEY"; printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$KNOWN_HOSTS"; chmod 600 "$SSH_KEY" "$KNOWN_HOSTS"
          SSH_OPTS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS -i $SSH_KEY"; REMOTE="$DEPLOY_USER@$DEPLOY_HOST"
          if [ "${CRON_MUTATED:-false}" = true ]; then ssh $SSH_OPTS "$REMOTE" "kubectl -n $DEPLOY_NAMESPACE set image cronjob/diary-v3-market market='$CRON_IMAGE_BEFORE'"; fi
          if [ "${WEB_MUTATED:-false}" = true ]; then ssh $SSH_OPTS "$REMOTE" "kubectl -n $DEPLOY_NAMESPACE set image deployment/diary-v3-web web='$WEB_IMAGE_BEFORE' && kubectl -n $DEPLOY_NAMESPACE scale deployment/diary-v3-web --replicas='$WEB_REPLICAS_BEFORE' && kubectl -n $DEPLOY_NAMESPACE rollout status deployment/diary-v3-web --timeout=300s"; fi
          if [ "${API_MUTATED:-false}" = true ]; then ssh $SSH_OPTS "$REMOTE" "kubectl -n $DEPLOY_NAMESPACE set image deployment/diary-v3-api api='$API_IMAGE_BEFORE' && kubectl -n $DEPLOY_NAMESPACE scale deployment/diary-v3-api --replicas='$API_REPLICAS_BEFORE' && kubectl -n $DEPLOY_NAMESPACE rollout status deployment/diary-v3-api --timeout=300s"; fi
          ssh $SSH_OPTS "$REMOTE" "kubectl -n $DEPLOY_NAMESPACE run rollback-smoke-\$RANDOM --rm -i --restart=Never --image=curlimages/curl --command -- curl -fsS --max-time 10 http://diary-v3-api:3101/healthz"
          ssh $SSH_OPTS "$REMOTE" "kubectl -n $DEPLOY_NAMESPACE run rollback-smoke-\$RANDOM --rm -i --restart=Never --image=curlimages/curl --command -- curl -fsS --max-time 10 http://diary-v3-api:3101/readyz"
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://v3.trade-basic.com/)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://v3.trade-basic.com/articles)" = 200
