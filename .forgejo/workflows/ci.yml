name: ci
# Pre-merge gate. Until this existed the only verification ran in `deploy.yml`,
# which triggers on `push: branches: [main]` — after the commit had already
# landed, so a red `main` was the first signal rather than a blocked pull
# request. See docs/operations/ci-cd-notes.md for the tier policy.
#
# The workflow alone cannot prevent a merge. Forgejo branch protection on `main`
# must require both status contexts below; the required setting is recorded in
# ci-cd-notes.md under "Pre-merge gate".
on:
  pull_request:
    branches: [main]

concurrency:
  # A superseded push to the same pull request is cancelled; unlike the deploy
  # workflow, nothing here mutates anything, so cancelling is safe.
  group: diary-v3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gates:
    runs-on: hk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Tracked secret scan
        run: |
          set -euo pipefail
          if git grep -nE '(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- ':!*.md' ':!ops/k3s/deploy-production-secrets.sh'; then
            echo 'Potential secret detected in tracked files' >&2
            exit 1
          fi
          git ls-files --error-unmatch .dockerignore
          grep -qxF '.env' .dockerignore
          grep -qxF '.env.*' .dockerignore

      - name: Install deps
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Replaces a bare `test:unit`: same suite, plus the coverage floors from
      # docs/audits/coverage-baseline-2026-10-25.md. Every floor is a measured
      # baseline rounded down, so this fails on a collapse rather than on
      # ordinary work.
      - name: Unit tests with coverage floors
        run: npm run test:coverage

      # Visible on the pull request that caused a drop, which is the point: a
      # number nobody sees cannot hold a floor.
      - name: Publish coverage trend
        if: always()
        run: |
          set -euo pipefail
          test -f coverage/coverage-summary.json || { echo 'no coverage summary produced' >&2; exit 1; }
          node -e '
            const total = require("./coverage/coverage-summary.json").total;
            const row = key => `| ${key} | ${total[key].pct}% | ${total[key].covered}/${total[key].total} |`;
            const lines = [
              "### Unit coverage", "",
              "| Metric | % | Covered |", "| --- | --- | --- |",
              ...["lines", "branches", "functions", "statements"].map(row), "",
              "Floors: docs/audits/coverage-baseline-2026-10-25.md. Unit scope only — the",
              "integration and browser suites are not counted here.",
            ].join("\n");
            console.log(lines);
            if (process.env.GITHUB_STEP_SUMMARY) require("node:fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines + "\n");
          '

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Contracts check
        run: npm run contracts:check

      # Four scripts — contrast, the Figure Rule, native edges and register
      # assignment — that tickets 120 and 122 created to stop drift and that ran
      # on developer machines only.
      - name: Design checks
        run: npm run design:check

      - name: Validate source deployment manifests
        run: npm run manifests:check

  integration:
    runs-on: hk
    # The chosen tier policy: integration is the higher-value half and gates the
    # merge; the browser suites stay nightly in regression.yml because 20-36
    # minutes per pull request is not a trade this project wants.
    steps:
      - name: Install Docker CLI
        env:
          DOCKER_CLI_SHA256: ${{ secrets.DOCKER_CLI_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$DOCKER_CLI_SHA256" || { echo 'DOCKER_CLI_SHA256 secret is required' >&2; exit 1; }
          archive=/tmp/docker-27.5.1.tgz
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz -o "$archive"
          echo "$DOCKER_CLI_SHA256  $archive" | sha256sum -c -
          tar xz --strip-components=1 -C /usr/bin docker/docker < "$archive"
          docker --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Use pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install deps
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Start disposable PostgreSQL
        run: |
          set -euo pipefail
          # Trap 1 in ci-cd-notes.md: the job runs inside a container, so a
          # host-published port binds the host loopback and is unreachable from
          # here. Share the job's network namespace instead.
          JOB_CONTAINER=$(cat /etc/hostname)
          docker inspect "$JOB_CONTAINER" >/dev/null || { echo "cannot resolve job container '$JOB_CONTAINER'" >&2; exit 1; }
          docker rm -f diary-v3-ci-postgres >/dev/null 2>&1 || true
          docker run -d --name diary-v3-ci-postgres \
            --network "container:$JOB_CONTAINER" \
            -e POSTGRES_DB=diary_v3 -e POSTGRES_USER=diary -e POSTGRES_PASSWORD=ci_disposable_only \
            postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          for attempt in $(seq 1 30); do
            if docker exec diary-v3-ci-postgres pg_isready -h 127.0.0.1 -U diary -d diary_v3 >/dev/null 2>&1; then
              echo 'DATABASE_URL=postgresql://diary:ci_disposable_only@127.0.0.1:5432/diary_v3' >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker logs diary-v3-ci-postgres
          exit 1

      - name: API integration tests
        env:
          JWT_SECRET: ci-only-diary-secret-not-for-use-outside-tests-123456
          NODE_ENV: test
        run: npm run test:integration

      - name: Stop disposable PostgreSQL
        if: always()
        run: docker rm -f diary-v3-ci-postgres || true
