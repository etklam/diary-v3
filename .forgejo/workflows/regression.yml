name: regression
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: diary-v3-regression
  cancel-in-progress: false

jobs:
  regression:
    runs-on: hk
    steps:
      - name: Install Docker CLI
        env:
          DOCKER_CLI_SHA256: ${{ secrets.DOCKER_CLI_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$DOCKER_CLI_SHA256" || { echo 'DOCKER_CLI_SHA256 secret is required' >&2; exit 1; }
          archive=/tmp/docker-27.5.1.tgz
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz -o "$archive"
          echo "$DOCKER_CLI_SHA256  $archive" | sha256sum -c -
          tar xz --strip-components=1 -C /usr/bin docker/docker < "$archive"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Use pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install deps
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: PostgreSQL backup and restore smoke
        run: |
          set -euo pipefail
          JOB_CONTAINER=$(cat /etc/hostname)
          docker inspect "$JOB_CONTAINER" >/dev/null || { echo "cannot resolve job container '$JOB_CONTAINER'" >&2; exit 1; }
          RESTORE_SMOKE_CONTAINER=diary-v3-ci-restore-smoke \
          RESTORE_SMOKE_JOB_CONTAINER="$JOB_CONTAINER" \
          RESTORE_SMOKE_PORT=5432 \
          npm run db:restore-smoke

      - name: Start disposable PostgreSQL
        run: |
          set -euo pipefail
          # The job itself runs inside a container, so a host-published port would
          # bind the host loopback, unreachable from the job's network namespace.
          # Share the job container's network namespace instead: PostgreSQL then
          # listens on 127.0.0.1:5432 inside the job itself, keeping the
          # local-only DATABASE_URL guard in tests meaningful.
          JOB_CONTAINER=$(cat /etc/hostname)
          docker inspect "$JOB_CONTAINER" >/dev/null || { echo "cannot resolve job container '$JOB_CONTAINER'" >&2; exit 1; }
          docker rm -f diary-v3-ci-postgres >/dev/null 2>&1 || true
          docker run -d --name diary-v3-ci-postgres \
            --network "container:$JOB_CONTAINER" \
            -e POSTGRES_DB=diary_v3 -e POSTGRES_USER=diary -e POSTGRES_PASSWORD=ci_disposable_only \
            postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          for attempt in $(seq 1 30); do
            if docker exec diary-v3-ci-postgres pg_isready -h 127.0.0.1 -U diary -d diary_v3 >/dev/null 2>&1; then
              echo 'DATABASE_URL=postgresql://diary:ci_disposable_only@127.0.0.1:5432/diary_v3' >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker logs diary-v3-ci-postgres
          exit 1

      - name: API integration tests
        env:
          JWT_SECRET: ci-only-diary-secret-not-for-use-outside-tests-123456
          NODE_ENV: test
        run: npm run test:integration

      - name: Install regression browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Full Chromium regression
        env:
          CI: "true"
        run: npm run test:e2e

      - name: WebKit critical path
        env:
          CI: "true"
        run: npm run test:e2e:webkit:critical

      - name: Build Docker images for extended artifact regression
        run: |
          set -euo pipefail
          API_IMAGE="diary-v3-regression-api:$GITHUB_SHA"
          WEB_IMAGE="diary-v3-regression-web:$GITHUB_SHA"
          docker build --platform linux/amd64 --target api -t "$API_IMAGE" .
          docker build --platform linux/amd64 --target web -t "$WEB_IMAGE" .
          echo "RELEASE_API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"
          echo "RELEASE_WEB_IMAGE=$WEB_IMAGE" >> "$GITHUB_ENV"
          echo "RELEASE_API_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$API_IMAGE")" >> "$GITHUB_ENV"
          echo "RELEASE_WEB_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$WEB_IMAGE")" >> "$GITHUB_ENV"

      - name: Extended release artifact regression
        env:
          CI: "true"
        run: |
          set -euo pipefail
          JOB_CONTAINER=$(cat /etc/hostname)
          docker inspect "$JOB_CONTAINER" >/dev/null || { echo "cannot resolve job container '$JOB_CONTAINER'" >&2; exit 1; }
          RELEASE_E2E_DOCKER_NETWORK="container:$JOB_CONTAINER" \
          RELEASE_E2E_DOCKER_LABEL="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          RELEASE_E2E_API_IMAGE="$RELEASE_API_IMAGE" \
          RELEASE_E2E_WEB_IMAGE="$RELEASE_WEB_IMAGE" \
          RELEASE_E2E_API_IMAGE_ID="$RELEASE_API_IMAGE_ID" \
          RELEASE_E2E_WEB_IMAGE_ID="$RELEASE_WEB_IMAGE_ID" \
          npm run test:e2e:release:regression

      - name: Stop release E2E containers
        if: always()
        run: docker ps -aq --filter "label=diary-v3.release-e2e=run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | xargs -r docker rm -f

      - name: Stop disposable PostgreSQL
        if: always()
        run: docker rm -f diary-v3-ci-postgres || true
